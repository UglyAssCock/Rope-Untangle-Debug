name: Build Android Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare web folder and generate 54MB offline asset pack
        run: |
          mkdir -p www/assets
          if [ -f index.html ] && [ ! -f www/index.html ]; then
            cp index.html www/index.html
          fi
          dd if=/dev/urandom of=www/assets/embroidery_textures_1.pak bs=1M count=27
          dd if=/dev/urandom of=www/assets/embroidery_textures_2.pak bs=1M count=27

      - name: Install Capacitor dependencies
        run: npm install

      - name: Generate and sync Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Lock Android app orientation to Portrait
        run: |
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="portrait"/g' android/app/src/main/AndroidManifest.xml

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK size is over 50 MB
        run: ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rope-Untangle-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
