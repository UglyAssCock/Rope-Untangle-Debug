<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Rope Untangle</title>
  <style>
    :root {
      --bg-linen: #f4ede0;
      --bg-card: #fbf6ec;
      --wood-dark: #6d4323;
      --wood-mid: #9c6639;
      --wood-light: #c68f59;
      --text-main: #4a321f;
      --text-muted: #7d6249;
      --accent-gold: #e2a83b;
      --accent-sage: #6d8c65;
      --accent-rose: #c96f5d;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-linen);
      font-family: "Georgia", "Palatino Linotype", "Book Antiqua", serif;
      color: var(--text-main);
      touch-action: none;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 14px) 14px env(safe-area-inset-bottom, 16px) 14px;
      background-image:
        radial-gradient(circle at 18% 12%, rgba(255, 252, 244, 0.8) 0%, transparent 45%),
        radial-gradient(circle at 82% 88%, rgba(226, 168, 59, 0.12) 0%, transparent 50%),
        repeating-linear-gradient(0deg, rgba(138, 106, 74, 0.045) 0px, rgba(138, 106, 74, 0.045) 1px, transparent 1px, transparent 5px),
        repeating-linear-gradient(90deg, rgba(138, 106, 74, 0.045) 0px, rgba(138, 106, 74, 0.045) 1px, transparent 1px, transparent 5px);
    }

    .top-bar {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 5;
      margin-top: 6px;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-card);
      border: 2px solid #dfd1bc;
      border-radius: 18px;
      padding: 8px 14px;
      box-shadow: 0 4px 12px rgba(74, 50, 31, 0.08), inset 0 0 0 2px #fffdf9;
    }

    .level-nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1.5px solid #cbb698;
      background: #f3eadb;
      color: var(--text-main);
      font-size: 16px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.15s ease;
    }

    .nav-btn:active {
      transform: scale(0.92);
    }

    .nav-btn:disabled {
      opacity: 0.35;
      pointer-events: none;
    }

    .level-title {
      font-size: 19px;
      font-weight: bold;
      letter-spacing: 0.4px;
      color: var(--wood-dark);
      min-width: 96px;
      text-align: center;
    }

    .stats-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stat-pill {
      background: #f2e8d7;
      border: 1.5px solid #d8c6ac;
      border-radius: 12px;
      padding: 5px 10px;
      text-align: center;
      min-width: 68px;
    }

    .stat-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      display: block;
    }

    .stat-value {
      font-size: 15px;
      font-weight: bold;
      color: var(--wood-dark);
    }

    .stat-value.solved-text {
      color: var(--accent-sage);
    }

    .sub-info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px;
      font-size: 13px;
      color: var(--text-muted);
      font-style: italic;
    }

    .sound-btn {
      background: var(--bg-card);
      border: 1.5px solid #d8c6ac;
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 12px;
      color: var(--text-main);
      font-family: inherit;
      cursor: pointer;
    }

    .canvas-stage {
      position: relative;
      flex: 1;
      width: 100%;
      max-width: 480px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    canvas {
      display: block;
      touch-action: none;
    }

    .bottom-bar {
      width: 100%;
      max-width: 460px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 5;
      margin-bottom: 4px;
    }

    .action-btn {
      flex: 1;
      height: 50px;
      border-radius: 16px;
      border: 2px solid #c8b090;
      background: var(--bg-card);
      color: var(--text-main);
      font-family: inherit;
      font-size: 15px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(74, 50, 31, 0.1), inset 0 0 0 2px #fffdf9;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.2s ease, opacity 0.2s ease;
    }

    .action-btn:active {
      transform: scale(0.96);
    }

    .action-btn.primary {
      background: linear-gradient(180deg, #8ca97e 0%, #68875b 100%);
      border-color: #547049;
      color: #fffdf9;
      box-shadow: 0 4px 12px rgba(84, 112, 73, 0.28), inset 0 1px 0 rgba(255,255,255,0.35);
    }

    .action-btn:disabled {
      opacity: 0.45;
      pointer-events: none;
    }

    .victory-toast {
      position: absolute;
      bottom: 84px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(251, 246, 236, 0.97);
      border: 2.5px solid #b58c56;
      border-radius: 20px;
      padding: 12px 22px;
      text-align: center;
      box-shadow: 0 10px 26px rgba(61, 39, 20, 0.22), inset 0 0 0 2px #fffdf9;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease, transform 0.28s ease;
      z-index: 10;
      white-space: nowrap;
    }

    .victory-toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    .victory-toast h3 {
      font-size: 18px;
      color: var(--wood-dark);
      margin-bottom: 2px;
    }

    .victory-toast p {
      font-size: 13px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="top-bar">
      <div class="header-row">
        <div class="level-nav">
          <button class="nav-btn" id="prevLevelBtn" aria-label="Previous Level">&#8249;</button>
          <div class="level-title" id="levelTitle">Level 1</div>
          <button class="nav-btn" id="nextUnlockedBtn" aria-label="Next Unlocked Level">&#8250;</button>
        </div>
        <div class="stats-group">
          <div class="stat-pill">
            <span class="stat-label">Moves</span>
            <span class="stat-value" id="movesCount">0</span>
          </div>
          <div class="stat-pill">
            <span class="stat-label">Crossings</span>
            <span class="stat-value" id="crossingsCount">0</span>
          </div>
        </div>
      </div>
      <div class="sub-info-row">
        <span id="statusHint">Tap a rope end, then tap an empty dark hole</span>
        <button class="sound-btn" id="soundToggleBtn">Sound: ON</button>
      </div>
    </div>

    <div class="canvas-stage" id="canvasStage">
      <canvas id="gameCanvas"></canvas>
    </div>

    <div class="victory-toast" id="victoryToast">
      <h3>Embroidery Untangled!</h3>
      <p id="victorySubtext">All threads lie flat and neat.</p>
    </div>

    <div class="bottom-bar">
      <button class="action-btn" id="restartBtn">&#8634; Restart</button>
      <button class="action-btn" id="hintBtn">&#10024; Hint</button>
      <button class="action-btn primary" id="nextLevelBtn" disabled>Next Level &#10140;</button>
    </div>
  </div>

  <script>
    (function () {
      "use strict";

      const SAVE_KEY = "cozy_rope_untangle_save_v1";

      // Persistent state
      let currentLevel = 1;
      let maxUnlockedLevel = 1;
      let soundEnabled = true;

      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && typeof parsed.maxUnlockedLevel === "number") {
            maxUnlockedLevel = Math.max(1, Math.floor(parsed.maxUnlockedLevel));
            currentLevel = Math.max(1, Math.min(maxUnlockedLevel, Math.floor(parsed.currentLevel || maxUnlockedLevel)));
          }
          if (parsed && typeof parsed.soundEnabled === "boolean") {
            soundEnabled = parsed.soundEnabled;
          }
        }
      } catch (e) {
        // Ignore storage errors
      }

      function saveProgress() {
        try {
          localStorage.setItem(
            SAVE_KEY,
            JSON.stringify({
              currentLevel: currentLevel,
              maxUnlockedLevel: maxUnlockedLevel,
              soundEnabled: soundEnabled
            })
          );
        } catch (e) {
          // Ignore storage errors
        }
      }

      // Web Audio synthesizer for cozy tactile wooden clicks and chimes
      let audioCtx = null;
      function getAudioContext() {
        if (!soundEnabled) return null;
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            audioCtx = new AudioContextClass();
          }
        }
        if (audioCtx && audioCtx.state === "suspended") {
          audioCtx.resume();
        }
        return audioCtx;
      }

      function playTone(freq, type, duration, gainVal, slideFreq) {
        const ctx = getAudioContext();
        if (!ctx) return;
        try {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = type || "sine";
          osc.frequency.setValueAtTime(freq, ctx.currentTime);
          if (slideFreq) {
            osc.frequency.exponentialRampToValueAtTime(slideFreq, ctx.currentTime + duration);
          }
          gain.gain.setValueAtTime(gainVal || 0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + duration);
        } catch (e) {}
      }

      function playWoodSelect() {
        playTone(340, "triangle", 0.08, 0.14, 520);
      }

      function playRopeMove() {
        playTone(260, "sine", 0.14, 0.15, 420);
        setTimeout(() => playTone(480, "triangle", 0.09, 0.11, 390), 90);
      }

      function playVictoryChime() {
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((n, idx) => {
          setTimeout(() => playTone(n, "triangle", 0.36, 0.16, n * 1.01), idx * 95);
        });
      }

      // DOM elements
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const stage = document.getElementById("canvasStage");
      const levelTitleEl = document.getElementById("levelTitle");
      const movesCountEl = document.getElementById("movesCount");
      const crossingsCountEl = document.getElementById("crossingsCount");
      const statusHintEl = document.getElementById("statusHint");
      const prevLevelBtn = document.getElementById("prevLevelBtn");
      const nextUnlockedBtn = document.getElementById("nextUnlockedBtn");
      const restartBtn = document.getElementById("restartBtn");
      const hintBtn = document.getElementById("hintBtn");
      const nextLevelBtn = document.getElementById("nextLevelBtn");
      const victoryToast = document.getElementById("victoryToast");
      const victorySubtext = document.getElementById("victorySubtext");
      const soundToggleBtn = document.getElementById("soundToggleBtn");

      soundToggleBtn.textContent = soundEnabled ? "Sound: ON" : "Sound: OFF";

      // Seeded deterministic PRNG so each level is consistent
      function createRNG(seed) {
        let s = (seed * 1664525 + 1013904223) >>> 0;
        return function () {
          s = (s * 1664525 + 1013904223) >>> 0;
          return (s & 0xfffffff) / 0x10000000;
        };
      }

      // Level parameters scaling:
      // Starts with 12 pegs on the wooden ring and scales up in pegs, ropes, and fewer empty holes
      function getLevelSpec(level) {
        if (level === 1) return { pegs: 12, ropes: 4, minCross: 2, scrambles: 8 };
        if (level === 2) return { pegs: 12, ropes: 4, minCross: 3, scrambles: 12 };
        if (level === 3) return { pegs: 12, ropes: 5, minCross: 3, scrambles: 14 };
        if (level === 4) return { pegs: 12, ropes: 5, minCross: 4, scrambles: 18 };
        if (level === 5) return { pegs: 12, ropes: 5, minCross: 5, scrambles: 24 };
        if (level <= 8) return { pegs: 14, ropes: 6, minCross: 5, scrambles: 26 };
        if (level <= 11) return { pegs: 15, ropes: 7, minCross: 6, scrambles: 32 }; // 1 empty hole!
        if (level <= 15) return { pegs: 16, ropes: 7, minCross: 7, scrambles: 36 };
        if (level <= 19) return { pegs: 17, ropes: 8, minCross: 8, scrambles: 42 }; // 1 empty hole!
        if (level <= 24) return { pegs: 18, ropes: 8, minCross: 9, scrambles: 48 };
        if (level <= 30) return { pegs: 19, ropes: 9, minCross: 10, scrambles: 55 }; // 1 empty hole!
        const extra = Math.min(6, Math.floor((level - 30) / 5));
        const pegs = 20 + extra;
        const ropes = Math.floor((pegs - 1) / 2);
        return { pegs: pegs, ropes: ropes, minCross: ropes + 2, scrambles: 65 };
      }

      // Rope palettes: mostly soft cream-white shades, some warm golden-yellow shades
      const WHITE_SHADES = [
        { base: "#FBF8F1", ridge: "#E5DEC9", edge: "#CFC5AE", cap: "#FFFDF9" },
        { base: "#F5EFE2", ridge: "#DDD3BC", edge: "#C4B79C", cap: "#FAF6EC" },
        { base: "#F9F4E8", ridge: "#E2D9C3", edge: "#C9BEA4", cap: "#FFFDF8" }
      ];
      const YELLOW_SHADES = [
        { base: "#F3C350", ridge: "#DDA62B", edge: "#B98416", cap: "#FAD77B" },
        { base: "#E9B33B", ridge: "#CF961E", edge: "#AD780E", cap: "#F5CA63" }
      ];

      // Game State
      let numPegs = 12;
      let pegs = []; // [{ x, y, angle }]
      let ropes = []; // [{ id, pegA, pegB, style, isYellow }]
      let initialRopesSnapshot = [];
      let selectedEndpoint = null; // { ropeIndex, end: 'A' | 'B', pegIndex }
      let moveAnimation = null; // { ropeIndex, end, fromPeg, toPeg, startTime, duration }
      let hintHighlight = null; // { ropeA, ropeB, emptyPeg, until }
      let celebrationParticles = [];
      let moves = 0;
      let crossings = 0;
      let isSolved = false;
      let boardMetrics = { cx: 0, cy: 0, ringRadius: 0, ringWidth: 0, pegRadius: 0 };

      // Check if two chords (pegA1, pegB1) and (pegA2, pegB2) strictly intersect inside the circle
      function chordsCross(a1, b1, a2, b2) {
        if (a1 === a2 || a1 === b2 || b1 === a2 || b1 === b2) return false;
        const min1 = Math.min(a1, b1);
        const max1 = Math.max(a1, b1);
        const a2Inside = a2 > min1 && a2 < max1;
        const b2Inside = b2 > min1 && b2 < max1;
        return a2Inside !== b2Inside;
      }

      function computeAllCrossings(ropeList) {
        const pairs = [];
        for (let i = 0; i < ropeList.length; i++) {
          for (let j = i + 1; j < ropeList.length; j++) {
            if (chordsCross(ropeList[i].pegA, ropeList[i].pegB, ropeList[j].pegA, ropeList[j].pegB)) {
              pairs.push([i, j]);
            }
          }
        }
        return pairs;
      }

      function getOccupiedMap(ropeList) {
        const map = new Array(numPegs).fill(null);
        ropeList.forEach((r, idx) => {
          map[r.pegA] = { ropeIndex: idx, end: "A" };
          map[r.pegB] = { ropeIndex: idx, end: "B" };
        });
        return map;
      }

      function generateLevel(level) {
        const spec = getLevelSpec(level);
        numPegs = spec.pegs;
        const numRopes = spec.ropes;
        const rng = createRNG(level * 9173 + 41);

        // Step 1: Create a guaranteed solvable non-crossing layout around the circle
        // Choose 2 * numRopes distinct pegs and pair adjacent chosen pegs around the perimeter
        const allIndices = [];
        for (let i = 0; i < numPegs; i++) allIndices.push(i);

        // Shuffle to pick which holes start empty
        for (let i = allIndices.length - 1; i > 0; i--) {
          const j = Math.floor(rng() * (i + 1));
          const tmp = allIndices[i];
          allIndices[i] = allIndices[j];
          allIndices[j] = tmp;
        }
        const chosenPegs = allIndices.slice(0, numRopes * 2).sort((a, b) => a - b);

        const baseRopes = [];
        const offset = Math.floor(rng() * chosenPegs.length);
        for (let r = 0; r < numRopes; r++) {
          const pA = chosenPegs[(offset + r * 2) % chosenPegs.length];
          const pB = chosenPegs[(offset + r * 2 + 1) % chosenPegs.length];
          // ~72% cream-white ropes, ~28% golden-yellow ropes (at least 1 yellow rope per level)
          const isYellow = r === 1 || (r > 1 && r % 4 === 3);
          const stylePool = isYellow ? YELLOW_SHADES : WHITE_SHADES;
          const style = stylePool[r % stylePool.length];
          baseRopes.push({
            id: r,
            pegA: pA,
            pegB: pB,
            style: style,
            isYellow: isYellow
          });
        }

        // Step 2: Scramble by swapping and moving endpoints into empty pegs until tangled Across the middle
        let bestCandidate = null;
        let bestCrossCount = -1;

        for (let attempt = 0; attempt < 40; attempt++) {
          const candidate = baseRopes.map((r) => ({ ...r }));
          for (let step = 0; step < spec.scrambles; step++) {
            const r1 = Math.floor(rng() * numRopes);
            const r2 = Math.floor(rng() * numRopes);
            if (r1 !== r2) {
              const end1 = rng() < 0.5 ? "pegA" : "pegB";
              const end2 = rng() < 0.5 ? "pegA" : "pegB";
              const tmp = candidate[r1][end1];
              candidate[r1][end1] = candidate[r2][end2];
              candidate[r2][end2] = tmp;
            }
            // Also occasionally move one endpoint into a random empty hole
            const occ = new Set();
            candidate.forEach((r) => {
              occ.add(r.pegA);
              occ.add(r.pegB);
            });
            const empties = [];
            for (let p = 0; p < numPegs; p++) {
              if (!occ.has(p)) empties.push(p);
            }
            if (empties.length > 0) {
              const rPick = Math.floor(rng() * numRopes);
              const ePick = empties[Math.floor(rng() * empties.length)];
              if (rng() < 0.5) candidate[rPick].pegA = ePick;
              else candidate[rPick].pegB = ePick;
            }
          }

          // Favor chords that stretch across the middle (avoid tiny adjacent-peg ropes)
          const crossPairs = computeAllCrossings(candidate);
          if (crossPairs.length > bestCrossCount) {
            bestCrossCount = crossPairs.length;
            bestCandidate = candidate;
          }
          if (crossPairs.length >= spec.minCross) {
            bestCandidate = candidate;
            break;
          }
        }

        initialRopesSnapshot = bestCandidate.map((r) => ({ ...r }));
        resetToInitialLayout();
      }

      function resetToInitialLayout() {
        ropes = initialRopesSnapshot.map((r) => ({ ...r }));
        selectedEndpoint = null;
        moveAnimation = null;
        hintHighlight = null;
        celebrationParticles = [];
        moves = 0;
        isSolved = false;
        victoryToast.classList.remove("visible");
        updateBoardMetrics();
        refreshStateUI();
      }

      function refreshStateUI() {
        const crossPairs = computeAllCrossings(ropes);
        crossings = crossPairs.length;

        levelTitleEl.textContent = "Level " + currentLevel;
        movesCountEl.textContent = String(moves);
        crossingsCountEl.textContent = String(crossings);

        if (crossings === 0) {
          crossingsCountEl.classList.add("solved-text");
        } else {
          crossingsCountEl.classList.remove("solved-text");
        }

        prevLevelBtn.disabled = currentLevel <= 1;
        nextUnlockedBtn.disabled = currentLevel >= maxUnlockedLevel;
        nextLevelBtn.disabled = !isSolved && currentLevel >= maxUnlockedLevel;

        if (isSolved) {
          statusHintEl.textContent = "Solved! Tap Next Level to continue";
        } else if (selectedEndpoint) {
          statusHintEl.textContent = "Now tap any dark empty hole to move the rope";
        } else {
          const emptyHoles = numPegs - ropes.length * 2;
          statusHintEl.textContent =
            numPegs + " pegs • " + ropes.length + " ropes • " + emptyHoles + (emptyHoles === 1 ? " empty hole" : " empty holes");
        }
      }

      function updateBoardMetrics() {
        const rect = stage.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
        const size = Math.min(rect.width, rect.height);
        canvas.style.width = rect.width + "px";
        canvas.style.height = rect.height + "px";
        canvas.width = Math.floor(rect.width * dpr);
        canvas.height = Math.floor(rect.height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const cx = rect.width / 2;
        const cy = rect.height / 2 + 8;
        const outerRadius = Math.max(110, size * 0.43);
        const ringWidth = Math.max(26, outerRadius * 0.185);
        const ringRadius = outerRadius - ringWidth * 0.5;
        const pegRadius = Math.min(
          ringWidth * 0.37,
          (2 * Math.PI * ringRadius) / (numPegs * 2.55)
        );

        boardMetrics = {
          width: rect.width,
          height: rect.height,
          cx: cx,
          cy: cy,
          outerRadius: outerRadius,
          ringRadius: ringRadius,
          innerRadius: outerRadius - ringWidth,
          ringWidth: ringWidth,
          pegRadius: pegRadius
        };

        pegs = [];
        for (let i = 0; i < numPegs; i++) {
          const angle = -Math.PI / 2 + (i * 2 * Math.PI) / numPegs;
          pegs.push({
            x: cx + Math.cos(angle) * ringRadius,
            y: cy + Math.sin(angle) * ringRadius,
            angle: angle
          });
        }
      }

      // Draw embroidered floral motifs on corners and center fabric
      function drawEmbroideredFlower(x, y, scale, petalColor, centerColor, leafAngle) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);

        // Stitched leaves
        for (let l = -1; l <= 1; l += 2) {
          ctx.save();
          ctx.rotate(leafAngle + l * 0.65);
          ctx.fillStyle = "#8ca67d";
          ctx.strokeStyle = "#6e8760";
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.ellipse(16, 0, 9, 4.5, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          // Leaf center stitch vein
          ctx.beginPath();
          ctx.moveTo(9, 0);
          ctx.lineTo(23, 0);
          ctx.strokeStyle = "#dce6d3";
          ctx.lineWidth = 1;
          ctx.stroke();
          ctx.restore();
        }

        // 8 embroidered satin-stitch petals
        const numPetals = 8;
        for (let i = 0; i < numPetals; i++) {
          ctx.save();
          ctx.rotate((i * Math.PI * 2) / numPetals);
          ctx.fillStyle = petalColor;
          ctx.strokeStyle = "rgba(122, 88, 56, 0.35)";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.ellipse(10, 0, 7.5, 3.8, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          // Thread rib lines inside petal
          ctx.strokeStyle = "rgba(255, 255, 255, 0.55)";
          ctx.lineWidth = 0.9;
          ctx.beginPath();
          ctx.moveTo(5, 0);
          ctx.lineTo(14, 0);
          ctx.stroke();
          ctx.restore();
        }

        // French knot center
        ctx.fillStyle = centerColor;
        ctx.beginPath();
        ctx.arc(0, 0, 4.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#9e7029";
        ctx.lineWidth = 1.2;
        ctx.stroke();

        ctx.restore();
      }

      function drawBackgroundEmbroidery() {
        const { width, height, cx, cy, outerRadius } = boardMetrics;
        const cornerOffset = 34;

        // Corner embroidered blossoms on the beige linen background
        drawEmbroideredFlower(cornerOffset, cornerOffset, 1.05, "#FFFDF7", "#E6B44C", 0.7);
        drawEmbroideredFlower(width - cornerOffset, cornerOffset, 1.05, "#F9E3CE", "#D97F64", 2.4);
        drawEmbroideredFlower(cornerOffset, height - cornerOffset, 1.05, "#F9E3CE", "#D97F64", -0.7);
        drawEmbroideredFlower(width - cornerOffset, height - cornerOffset, 1.05, "#FFFDF7", "#E6B44C", -2.4);

        // Top embroidery hoop brass clasp screw
        const claspY = cy - outerRadius - 14;
        ctx.save();
        // Wooden lug brackets
        ctx.fillStyle = "#8c5830";
        ctx.strokeStyle = "#593519";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(cx - 24, claspY - 4, 20, 22, 5);
        ctx.roundRect(cx + 4, claspY - 4, 20, 22, 5);
        ctx.fill();
        ctx.stroke();

        // Brass screw bar & thumb wheel
        const brassGrad = ctx.createLinearGradient(cx - 34, claspY, cx + 34, claspY);
        brassGrad.addColorStop(0, "#b8862d");
        brassGrad.addColorStop(0.5, "#f5d47a");
        brassGrad.addColorStop(1, "#9c6d1e");
        ctx.fillStyle = brassGrad;
        ctx.strokeStyle = "#6e4b10";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.roundRect(cx - 32, claspY + 2, 64, 8, 3);
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.roundRect(cx + 26, claspY - 5, 11, 22, 4);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      function drawWoodenHoopAndFabric() {
        const { cx, cy, outerRadius, innerRadius, ringRadius, ringWidth } = boardMetrics;

        // Drop shadow under wooden hoop
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy + 7, outerRadius + 2, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(62, 38, 18, 0.22)";
        ctx.fill();
        ctx.restore();

        // Inner taut cream embroidery fabric drum
        ctx.save();
        const fabricGrad = ctx.createRadialGradient(cx, cy - innerRadius * 0.2, 10, cx, cy, innerRadius);
        fabricGrad.addColorStop(0, "#fdfaf2");
        fabricGrad.addColorStop(0.82, "#f4ebd9");
        fabricGrad.addColorStop(1, "#e2d4bc");
        ctx.beginPath();
        ctx.arc(cx, cy, innerRadius + 2, 0, Math.PI * 2);
        ctx.fillStyle = fabricGrad;
        ctx.fill();

        // Subtle woven linen grid inside fabric
        ctx.clip();
        ctx.strokeStyle = "rgba(150, 120, 85, 0.065)";
        ctx.lineWidth = 1;
        const step = 9;
        for (let x = cx - innerRadius; x <= cx + innerRadius; x += step) {
          ctx.beginPath();
          ctx.moveTo(x, cy - innerRadius);
          ctx.lineTo(x, cy + innerRadius);
          ctx.stroke();
        }
        for (let y = cy - innerRadius; y <= cy + innerRadius; y += step) {
          ctx.beginPath();
          ctx.moveTo(cx - innerRadius, y);
          ctx.lineTo(cx + innerRadius, y);
          ctx.stroke();
        }

        // Delicate center embroidered floral medallion watermark
        ctx.globalAlpha = 0.26;
        drawEmbroideredFlower(cx, cy, 1.85, "#fffcf5", "#ddb052", 0.4);
        ctx.globalAlpha = 1;
        ctx.restore();

        // Wooden ring base (warm carved oak/beech wood gradient)
        ctx.save();
        const woodGrad = ctx.createRadialGradient(cx, cy, innerRadius, cx, cy, outerRadius);
        woodGrad.addColorStop(0, "#754826");
        woodGrad.addColorStop(0.14, "#ab7343");
        woodGrad.addColorStop(0.5, "#cc9662");
        woodGrad.addColorStop(0.86, "#9e6739");
        woodGrad.addColorStop(1, "#663d1e");

        ctx.beginPath();
        ctx.arc(cx, cy, outerRadius, 0, Math.PI * 2);
        ctx.arc(cx, cy, innerRadius, 0, Math.PI * 2, true);
        ctx.fillStyle = woodGrad;
        ctx.fill();

        // Wood grain concentric rings
        ctx.strokeStyle = "rgba(92, 52, 22, 0.22)";
        ctx.lineWidth = 1.2;
        for (let r = innerRadius + 5; r < outerRadius - 4; r += 5.5) {
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.stroke();
        }

        // Specular highlight along top rim of wooden ring
        ctx.strokeStyle = "rgba(255, 240, 215, 0.35)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(cx, cy, ringRadius, -Math.PI * 0.85, -Math.PI * 0.15);
        ctx.stroke();
        ctx.restore();
      }

      function getRopeEndpointsCoords(rope, index, now) {
        let pA = pegs[rope.pegA];
        let pB = pegs[rope.pegB];
        let ax = pA.x;
        let ay = pA.y;
        let bx = pB.x;
        let by = pB.y;
        let liftA = 0;
        let liftB = 0;

        if (moveAnimation && moveAnimation.ropeIndex === index) {
          const elapsed = now - moveAnimation.startTime;
          const t = Math.min(1, elapsed / moveAnimation.duration);
          // Smooth cubic ease out
          const ease = 1 - Math.pow(1 - t, 3);
          const fromP = pegs[moveAnimation.fromPeg];
          const toP = pegs[moveAnimation.toPeg];
          // Slight arc toward hoop center while moving
          const arcPull = Math.sin(t * Math.PI) * 26;
          const midX = fromP.x + (toP.x - fromP.x) * ease;
          const midY = fromP.y + (toP.y - fromP.y) * ease;
          const dirToCenterX = boardMetrics.cx - midX;
          const dirToCenterY = boardMetrics.cy - midY;
          const dist = Math.hypot(dirToCenterX, dirToCenterY) || 1;
          const curX = midX + (dirToCenterX / dist) * arcPull;
          const curY = midY + (dirToCenterY / dist) * arcPull;

          if (moveAnimation.end === "A") {
            ax = curX;
            ay = curY;
            liftA = Math.sin(t * Math.PI) * 6;
          } else {
            bx = curX;
            by = curY;
            liftB = Math.sin(t * Math.PI) * 6;
          }
        }

        return { ax, ay, bx, by, liftA, liftB };
      }

      function drawPegHoles(now) {
        const { pegRadius } = boardMetrics;
        const occupiedMap = getOccupiedMap(ropes);

        for (let i = 0; i < pegs.length; i++) {
          const p = pegs[i];
          const isOccupied = occupiedMap[i] !== null;

          // Outer carved wood bevel around hole
          ctx.save();
          ctx.beginPath();
          ctx.arc(p.x, p.y, pegRadius + 3.2, 0, Math.PI * 2);
          ctx.fillStyle = "#7a4b27";
          ctx.fill();

          ctx.beginPath();
          ctx.arc(p.x, p.y + 1, pegRadius + 2, 0, Math.PI * 2);
          ctx.strokeStyle = "rgba(255, 232, 200, 0.4)";
          ctx.lineWidth = 1.2;
          ctx.stroke();

          // Deep dark hole interior (visible on empty pegs)
          const holeGrad = ctx.createRadialGradient(
            p.x - pegRadius * 0.2,
            p.y - pegRadius * 0.2,
            1,
            p.x,
            p.y,
            pegRadius
          );
          holeGrad.addColorStop(0, "#1d1008");
          holeGrad.addColorStop(0.75, "#2d1a0e");
          holeGrad.addColorStop(1, "#472916");

          ctx.beginPath();
          ctx.arc(p.x, p.y, pegRadius, 0, Math.PI * 2);
          ctx.fillStyle = holeGrad;
          ctx.fill();

          // If a rope endpoint is selected, pulse all empty dark holes to guide the player
          if (!isOccupied && selectedEndpoint) {
            const pulse = 0.5 + 0.5 * Math.sin(now * 0.008);
            ctx.beginPath();
            ctx.arc(p.x, p.y, pegRadius + 2.5 + pulse * 2.5, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(255, 224, 130, ${0.55 + pulse * 0.35})`;
            ctx.lineWidth = 2.4;
            ctx.stroke();
          }

          // Hint highlight on target empty hole
          if (hintHighlight && now < hintHighlight.until && hintHighlight.emptyPeg === i) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, pegRadius + 5, 0, Math.PI * 2);
            ctx.strokeStyle = "#68b660";
            ctx.lineWidth = 3;
            ctx.stroke();
          }

          ctx.restore();
        }
      }

      function drawSingleRope(rope, index, now, isHinted) {
        const { pegRadius, cx, cy } = boardMetrics;
        const { ax, ay, bx, by, liftA, liftB } = getRopeEndpointsCoords(rope, index, now);

        const ropeThickness = Math.max(10, pegRadius * 1.18);
        // Subtle natural slack curve toward the center of the hoop
        const midX = (ax + bx) * 0.5;
        const midY = (ay + by) * 0.5;
        const slackFactor = 0.06;
        const ctrlX = midX + (cx - midX) * slackFactor;
        const ctrlY = midY + (cy - midY) * slackFactor;

        ctx.save();
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        // 1. Soft drop shadow beneath the rope
        ctx.beginPath();
        ctx.moveTo(ax, ay + 5 + liftA);
        ctx.quadraticCurveTo(ctrlX, ctrlY + 6, bx, by + 5 + liftB);
        ctx.strokeStyle = "rgba(48, 30, 14, 0.24)";
        ctx.lineWidth = ropeThickness + 3;
        ctx.stroke();

        // 2. Dark outer cord outline for crisp definition
        ctx.beginPath();
        ctx.moveTo(ax, ay - liftA);
        ctx.quadraticCurveTo(ctrlX, ctrlY, bx, by - liftB);
        ctx.strokeStyle = isHinted ? "#c95b48" : rope.style.edge;
        ctx.lineWidth = ropeThickness + 2.4;
        ctx.stroke();

        // 3. Main thick rope body
        ctx.beginPath();
        ctx.moveTo(ax, ay - liftA);
        ctx.quadraticCurveTo(ctrlX, ctrlY, bx, by - liftB);
        ctx.strokeStyle = rope.style.base;
        ctx.lineWidth = ropeThickness;
        ctx.stroke();

        // 4. Braided/twisted rope texture plies along the curve
        ctx.beginPath();
        ctx.moveTo(ax, ay - liftA);
        ctx.quadraticCurveTo(ctrlX, ctrlY, bx, by - liftB);
        ctx.strokeStyle = rope.style.ridge;
        ctx.lineWidth = ropeThickness * 0.72;
        ctx.setLineDash([ropeThickness * 0.55, ropeThickness * 0.55]);
        ctx.stroke();

        // 5. Top specular cotton sheen
        ctx.beginPath();
        ctx.moveTo(ax, ay - liftA);
        ctx.quadraticCurveTo(ctrlX, ctrlY, bx, by - liftB);
        ctx.strokeStyle = "rgba(255, 255, 255, 0.55)";
        ctx.lineWidth = ropeThickness * 0.26;
        ctx.setLineDash([ropeThickness * 0.55, ropeThickness * 0.55]);
        ctx.lineDashOffset = ropeThickness * 0.25;
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.restore();

        // 6. Draw both rope end knots/caps inside the pegs
        drawRopeEndCap(ax, ay - liftA, rope, index, "A", now);
        drawRopeEndCap(bx, by - liftB, rope, index, "B", now);
      }

      function drawRopeEndCap(x, y, rope, ropeIndex, endTag, now) {
        const { pegRadius } = boardMetrics;
        const isSelected =
          selectedEndpoint &&
          selectedEndpoint.ropeIndex === ropeIndex &&
          selectedEndpoint.end === endTag;

        const r = pegRadius * (isSelected ? 1.06 : 0.92);

        ctx.save();
        // Shadow under cap
        ctx.beginPath();
        ctx.arc(x, y + 2, r + 1, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(38, 22, 10, 0.35)";
        ctx.fill();

        // Outer stitched cap rim
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = rope.style.cap;
        ctx.fill();
        ctx.lineWidth = 2.2;
        ctx.strokeStyle = rope.style.edge;
        ctx.stroke();

        // Inner spiral knot detail
        ctx.beginPath();
        ctx.arc(x, y, r * 0.55, 0, Math.PI * 2);
        ctx.strokeStyle = rope.style.ridge;
        ctx.lineWidth = 1.8;
        ctx.stroke();

        // Center brass/wood pin dot
        ctx.beginPath();
        ctx.arc(x, y, r * 0.24, 0, Math.PI * 2);
        ctx.fillStyle = rope.isYellow ? "#8f5e10" : "#8c6d4e";
        ctx.fill();

        // Glowing selection ring when tapped
        if (isSelected) {
          const pulse = 0.5 + 0.5 * Math.sin(now * 0.01);
          ctx.beginPath();
          ctx.arc(x, y, r + 4 + pulse * 2.5, 0, Math.PI * 2);
          ctx.strokeStyle = "#f2b73f";
          ctx.lineWidth = 3;
          ctx.stroke();
        }
        ctx.restore();
      }

      function spawnCelebrationParticles() {
        celebrationParticles = [];
        const { cx, cy, innerRadius } = boardMetrics;
        const colors = ["#F3C350", "#FFFDF7", "#D97F64", "#8CA67D", "#E89B48"];
        for (let i = 0; i < 48; i++) {
          const angle = (Math.PI * 2 * i) / 48 + (Math.random() - 0.5) * 0.2;
          const speed = 1.2 + Math.random() * 2.8;
          const startDist = innerRadius * (0.2 + Math.random() * 0.65);
          celebrationParticles.push({
            x: cx + Math.cos(angle) * startDist,
            y: cy + Math.sin(angle) * startDist,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 0.6,
            size: 4 + Math.random() * 4,
            color: colors[i % colors.length],
            alpha: 1
          });
        }
      }

      function drawCelebrationParticles() {
        if (celebrationParticles.length === 0) return;
        ctx.save();
        for (let i = celebrationParticles.length - 1; i >= 0; i--) {
          const p = celebrationParticles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.04;
          p.alpha -= 0.014;
          if (p.alpha <= 0) {
            celebrationParticles.splice(i, 1);
            continue;
          }
          ctx.globalAlpha = Math.max(0, p.alpha);
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      // Pointer / Touch interaction:
      // Player taps a rope end, then taps an empty peg to move it there (also supports dragging to an empty peg)
      let draggingFromTap = false;

      function findNearestPeg(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const x = clientX - rect.left;
        const y = clientY - rect.top;
        const hitRadius = Math.max(26, boardMetrics.pegRadius * 2.15);
        let bestIdx = -1;
        let bestDist = hitRadius;
        for (let i = 0; i < pegs.length; i++) {
          const d = Math.hypot(pegs[i].x - x, pegs[i].y - y);
          if (d < bestDist) {
            bestDist = d;
            bestIdx = i;
          }
        }
        return bestIdx;
      }

      function executeMove(ropeIndex, endTag, fromPeg, toPeg) {
        if (fromPeg === toPeg) return;
        moveAnimation = {
          ropeIndex: ropeIndex,
          end: endTag,
          fromPeg: fromPeg,
          toPeg: toPeg,
          startTime: performance.now(),
          duration: 240
        };
        if (endTag === "A") {
          ropes[ropeIndex].pegA = toPeg;
        } else {
          ropes[ropeIndex].pegB = toPeg;
        }
        selectedEndpoint = null;
        hintHighlight = null;
        moves++;
        playRopeMove();
        refreshStateUI();
      }

      function onLevelSolved() {
        if (isSolved) return;
        isSolved = true;
        if (currentLevel >= maxUnlockedLevel) {
          maxUnlockedLevel = currentLevel + 1;
        }
        saveProgress();
        refreshStateUI();
        playVictoryChime();
        spawnCelebrationParticles();
        victorySubtext.textContent = "Solved in " + moves + (moves === 1 ? " move!" : " moves!");
        victoryToast.classList.add("visible");
      }

      canvas.addEventListener("pointerdown", function (e) {
        e.preventDefault();
        if (moveAnimation || isSolved) return;

        const pegIdx = findNearestPeg(e.clientX, e.clientY);
        if (pegIdx === -1) {
          selectedEndpoint = null;
          refreshStateUI();
          return;
        }

        const occupiedMap = getOccupiedMap(ropes);
        const occupant = occupiedMap[pegIdx];

        if (occupant) {
          // Tapped a peg with a rope end: select (or toggle off if tapping same peg)
          if (
            selectedEndpoint &&
            selectedEndpoint.ropeIndex === occupant.ropeIndex &&
            selectedEndpoint.end === occupant.end
          ) {
            selectedEndpoint = null;
          } else {
            selectedEndpoint = {
              ropeIndex: occupant.ropeIndex,
              end: occupant.end,
              pegIndex: pegIdx
            };
            draggingFromTap = true;
            playWoodSelect();
          }
          refreshStateUI();
        } else if (selectedEndpoint) {
          // Tapped an empty peg while a rope end is selected: move it there!
          executeMove(
            selectedEndpoint.ropeIndex,
            selectedEndpoint.end,
            selectedEndpoint.pegIndex,
            pegIdx
          );
          draggingFromTap = false;
        }
      });

      canvas.addEventListener("pointerup", function (e) {
        if (!draggingFromTap || !selectedEndpoint || moveAnimation || isSolved) {
          draggingFromTap = false;
          return;
        }
        draggingFromTap = false;
        const releasePeg = findNearestPeg(e.clientX, e.clientY);
        if (releasePeg !== -1 && releasePeg !== selectedEndpoint.pegIndex) {
          const occupiedMap = getOccupiedMap(ropes);
          if (occupiedMap[releasePeg] === null) {
            executeMove(
              selectedEndpoint.ropeIndex,
              selectedEndpoint.end,
              selectedEndpoint.pegIndex,
              releasePeg
            );
          }
        }
      });

      // UI Buttons
      restartBtn.addEventListener("click", function () {
        playWoodSelect();
        resetToInitialLayout();
      });

      hintBtn.addEventListener("click", function () {
        if (isSolved) return;
        const crossPairs = computeAllCrossings(ropes);
        if (crossPairs.length === 0) return;
        const occupiedMap = getOccupiedMap(ropes);
        let emptyPeg = -1;
        for (let i = 0; i < numPegs; i++) {
          if (occupiedMap[i] === null) {
            emptyPeg = i;
            break;
          }
        }
        const [rA, rB] = crossPairs[0];
        selectedEndpoint = {
          ropeIndex: rA,
          end: "A",
          pegIndex: ropes[rA].pegA
        };
        hintHighlight = {
          ropeA: rA,
          ropeB: rB,
          emptyPeg: emptyPeg,
          until: performance.now() + 2600
        };
        playWoodSelect();
        refreshStateUI();
      });

      nextLevelBtn.addEventListener("click", function () {
        if (currentLevel < maxUnlockedLevel || isSolved) {
          currentLevel++;
          if (currentLevel > maxUnlockedLevel) {
            maxUnlockedLevel = currentLevel;
          }
          saveProgress();
          playWoodSelect();
          generateLevel(currentLevel);
        }
      });

      prevLevelBtn.addEventListener("click", function () {
        if (currentLevel > 1) {
          currentLevel--;
          saveProgress();
          playWoodSelect();
          generateLevel(currentLevel);
        }
      });

      nextUnlockedBtn.addEventListener("click", function () {
        if (currentLevel < maxUnlockedLevel) {
          currentLevel++;
          saveProgress();
          playWoodSelect();
          generateLevel(currentLevel);
        }
      });

      soundToggleBtn.addEventListener("click", function () {
        soundEnabled = !soundEnabled;
        soundToggleBtn.textContent = soundEnabled ? "Sound: ON" : "Sound: OFF";
        if (soundEnabled) playWoodSelect();
        saveProgress();
      });

      window.addEventListener("resize", function () {
        updateBoardMetrics();
      });

      // Main render loop
      function renderLoop(now) {
        if (moveAnimation && now - moveAnimation.startTime >= moveAnimation.duration) {
          moveAnimation = null;
          const remaining = computeAllCrossings(ropes).length;
          if (remaining === 0 && !isSolved) {
            onLevelSolved();
          }
        }

        ctx.clearRect(0, 0, boardMetrics.width, boardMetrics.height);

        drawBackgroundEmbroidery();
        drawWoodenHoopAndFabric();
        drawPegHoles(now);

        // Draw non-selected ropes first, then selected/moving rope on top
        const activeRopeIdx = moveAnimation
          ? moveAnimation.ropeIndex
          : selectedEndpoint
          ? selectedEndpoint.ropeIndex
          : -1;

        for (let i = 0; i < ropes.length; i++) {
          if (i === activeRopeIdx) continue;
          const isHinted =
            hintHighlight &&
            now < hintHighlight.until &&
            (hintHighlight.ropeA === i || hintHighlight.ropeB === i);
          drawSingleRope(ropes[i], i, now, isHinted);
        }

        if (activeRopeIdx !== -1 && ropes[activeRopeIdx]) {
          drawSingleRope(ropes[activeRopeIdx], activeRopeIdx, now, false);
        }

        drawCelebrationParticles();

        requestAnimationFrame(renderLoop);
      }

      // Initialize game
      updateBoardMetrics();
      generateLevel(currentLevel);
      requestAnimationFrame(renderLoop);
    })();
  </script>
</body>
</html>
